worker_processes auto;
events { worker_connections 4096; }

http {
  upstream api {
    least_conn;
    server api-1:8000 max_fails=3 fail_timeout=10s;
    server api-2:8000 max_fails=3 fail_timeout=10s;
    server api-3:8000 max_fails=3 fail_timeout=10s;
    keepalive 64;
  }

  upstream web {
    server web:80;
  }

  limit_req_zone $binary_remote_addr zone=perip:10m rate=30r/s;
  client_max_body_size 6m;

  server {
    listen 80;

    location /api/ {
      limit_req zone=perip burst=60 nodelay;
      proxy_pass http://api;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_buffering off;
      proxy_read_timeout 120s;
      proxy_next_upstream error timeout http_502 http_503;
    }

    location /internal/ {
      proxy_pass http://api;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location / {
      proxy_pass http://web;
    }
  }
}
